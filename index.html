<title>休閒活動溝通板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：上方句子條，中間課文句子與分類格子，下方固定常用字。顏色依詞類固定，位置不會跳動 */
:root{
  --bg:#FFF6E6; --card:#FFFFFF; --ink:#4A342C; --muted:#7A6258; --line:#EAD9BF; --accent:#E0701F; --focus:#1E6FD9;
  --c-person:#F2C230; --c-verb:#4DB36A; --c-noun:#F2923C; --c-desc:#4F9BE8; --c-q:#9A66DA; --c-social:#EC6A9A; --c-core:#8C7468; --c-time:#8E63D6; --r-who:#3F7FD9; --r-where:#2E9B63; --r-what:#E0701F;
  --tile:130px;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;
  padding-block:10px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:5px solid var(--focus);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:clamp(22px,4vw,30px);font-weight:900;margin:0;flex:1;min-width:180px}
.seg{display:flex;border:4px solid var(--line);border-radius:26px;overflow:hidden;background:#fff}
.seg button{padding:8px 16px;font-size:20px;font-weight:900;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tg{min-height:48px;padding:0 16px;border:4px solid var(--line);border-radius:26px;background:#fff;font-size:20px;font-weight:900}
.tg[aria-pressed="true"]{background:#E7F8EE;border-color:#2E9B63}
.strip{display:flex;gap:10px;align-items:stretch}
.sent{flex:1;min-width:0;min-height:96px;background:#fff;border:6px solid var(--ink);border-radius:26px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:center}
.sent .hint{color:#B9A592;font-size:26px;font-weight:700;padding:6px 10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--c);color:#1E1A17;border-radius:16px;padding:4px 12px 4px 6px;font-size:28px;font-weight:900}
.chip svg{width:46px;height:46px;background:#fff;border-radius:12px}
.chip .t{padding:0 4px}
.actions{display:flex;flex-direction:column;gap:6px;width:150px}
.play{flex:1;border-radius:22px;background:var(--accent);color:#fff;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 0 #B5560F;min-height:64px}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #B5560F}
.play svg{width:36px;height:36px}
.mini{display:flex;gap:6px}
.mini button{flex:1;min-height:44px;border-radius:16px;background:#fff;border:4px solid var(--line);font-size:20px;font-weight:900}
.lessons{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.lessons button{flex:none;border:5px solid var(--c,var(--line));border-radius:24px;background:#fff;padding:4px 14px 4px 6px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:6px;min-height:60px}
.lessons button svg{width:44px;height:58px}
.lessons button[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.say{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.say button{flex:none;background:#fff;border:5px solid var(--c);border-radius:22px;padding:8px 16px;font-size:26px;font-weight:900;min-height:56px;white-space:nowrap}
.say button:active{background:var(--c);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;min-width:84px;min-height:56px;border-radius:18px 18px 8px 8px;background:var(--c);color:#1E1A17;font-size:24px;font-weight:900;opacity:.55;border-bottom:6px solid transparent}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--ink);transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:10px;min-height:150px}
.tile{background:#fff;border:6px solid var(--c);border-radius:22px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;min-height:calc(var(--tile)*1.05);text-align:center;font-weight:900;font-size:calc(var(--tile)*.2);line-height:1.15}
.tile .pic{width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.tile .pic svg{width:70%;max-width:calc(var(--tile)*.78);height:auto;max-height:calc(var(--tile)*.7)}
.tile .pic .glyph{font-size:calc(var(--tile)*.42);font-weight:900;color:var(--c)}
.tile:active{transform:scale(.96);background:#FFF3DD}
.tile.scan,.fslot.scan,.tabs button.scan,.play.scan,.mini button.scan,.say button.scan{outline:8px solid var(--focus);outline-offset:2px;z-index:2}
.core{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;background:#fff;border:4px solid var(--line);border-radius:22px;padding:8px}
.core .tile{min-height:86px;font-size:20px;border-width:5px;padding:4px 2px}
.core .tile .pic svg{width:46px;height:46px}
.core .tile .pic{flex:none}
.core .tile .pic .glyph{font-size:34px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:24px;padding:30px}
.pick{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#1E6FD9;color:#fff;font-size:34px;font-weight:900;text-align:center;z-index:30}
body.size-l{--tile:170px}body.size-m{--tile:130px}body.size-s{--tile:100px}
.frame{display:flex;gap:10px;align-items:stretch;background:#fff;border:6px solid #9A66DA;border-radius:26px;padding:8px;flex-wrap:wrap}
.frame .prev{width:230px;flex:none;border-radius:16px;overflow:hidden;background:#F6EEDD;display:flex;align-items:center;justify-content:center;color:#B9A592;font-weight:700;font-size:18px;text-align:center;min-height:144px;max-width:100%}
.frame .prev svg{display:block;width:100%;height:auto}
.fslots{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.fslot{border:5px dashed #D9C3A5;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;min-height:110px;font-size:24px;font-weight:900;color:#C9B390}
.fslot small{font-size:18px;font-weight:900}
.fslot.on{border-style:solid;border-color:var(--sc);background:var(--sc);color:#fff}
.fslot.on svg{height:56px;width:auto;max-width:90px;background:#fff;border-radius:12px;padding:2px}
.dlg{position:fixed;inset:0;background:rgba(74,52,44,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}
.dlg>div{background:#FFF6E6;border:8px solid #9A66DA;border-radius:28px;padding:16px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:10px}
.dlg h2{margin:0;font-size:30px}.dlg p{margin:0;font-size:18px;color:#7A6258;line-height:1.5}
.prs{display:flex;gap:10px;align-items:center;background:#fff;border:4px solid #EAD9BF;border-radius:20px;padding:8px}
.prs .ph{width:84px;height:84px;flex:none;border-radius:16px;overflow:hidden;background:#F6EEDD;display:flex;align-items:center;justify-content:center}
.prs .ph svg{height:84px;width:auto}
.prs input[type=text]{flex:1;min-width:0;font:inherit;font-size:26px;font-weight:900;border:4px solid #EAD9BF;border-radius:14px;padding:6px 10px;background:#fff;color:inherit}
.prs button,.dlg .row button{font:inherit;font-weight:900;font-size:20px;border:4px solid #D9C3A5;background:#fff;border-radius:16px;padding:8px 12px;color:inherit;cursor:pointer}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap}.dlg .row .go{background:#E0701F;color:#fff;border-color:#B5560F}
.pick3{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:stretch;background:#fff;border:5px solid var(--rc);border-radius:24px;padding:6px}
.prow .rl{width:96px;flex:none;background:var(--rc);color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:28px;line-height:1.15;padding:4px}
.prow .pt{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--tile)*.78),1fr));gap:8px}
.prow .tile{border-color:var(--rc);min-height:calc(var(--tile)*.95)}
.prow .tile[aria-pressed="true"]{background:var(--rc);color:#fff;transform:scale(1.04)}
.prow .tile[aria-pressed="true"] .pic svg{background:#fff;border-radius:12px}
.prow .tile.scan{outline:8px solid var(--focus)}
.fact{display:flex;flex-direction:column;gap:6px;width:150px}
.fact .play{min-height:60px}
.say button.sentb{border-width:6px}
@media (max-width:640px){.actions{width:104px}.play{font-size:26px}.chip{font-size:22px}.chip svg{width:38px;height:38px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 列印圖卡 */
.printonly{display:none}
body.print{background:#fff;padding:0}
body.print .app{display:none}
body.print .printonly{display:block}
.pg{page-break-after:always;padding:8mm 8mm}
.pg h2{margin:0 0 4mm;font-size:18pt}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4mm}
.pc{border:2.2mm solid var(--c);border-radius:4mm;height:40mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1.5mm;text-align:center;font-weight:900;font-size:15pt;break-inside:avoid}
.pc .pic{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
.pc .pic svg{height:24mm;width:auto;max-width:100%}
.pc .pic .glyph{font-size:30pt;color:var(--c)}
@page{size:A4 landscape;margin:0}
</style>

<div class="app" id="app"></div>
<div class="printonly" id="print"></div>

const nmOf=(k)=>k==='me'?'我':(PP[k]&&PP[k].name)||D.find(d=>d.key===k).who;
const picOf=(k,s)=>k==='me'?`<img src="${ME_IMG}" alt="我" style="height:${s}px;width:auto;max-width:100%;object-fit:contain;border-radius:12px;background:#fff;display:block">`:PP[k]&&PP[k].photo?`<img src="${PP[k].photo}" alt="" style="height:${s}px;width:${s}px;max-width:100%;object-fit:cover;border-radius:18px;display:block">`:A.heroSvg(k,s);
function photoFrom(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const z=240,c=document.createElement('canvas');c.width=c.height=z;const s=Math.min(im.width,im.height),x=(im.width-s)/2,y=(im.height-s)/2;c.getContext('2d').drawImage(im,x,y,s,s,0,0,z,z);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function tiles(){
  const t=[];
  t.push({id:'pme',cat:'person',role:'who',val:'me',label:'我',say:'我',art:picOf('me',150)});
  D.forEach(d=>t.push({id:'p'+d.key,cat:'person',role:'who',val:d.key,label:nmOf(d.key),say:nmOf(d.key),art:picOf(d.key,150),lesson:d.key}));
  D.forEach(d=>t.push({id:'v'+d.key,cat:'verb',role:'act',val:d.key,label:d.act,say:d.act,art:A.itemSvg(AICON[d.key],120),lesson:d.key}));
  D.forEach(d=>t.push({id:'l'+d.key,cat:'place',role:'place',val:d.key,label:'在'+d.place,say:'在'+d.place,art:A.itemSvg(PICON[d.key],120),lesson:d.key}));
  TIMES.forEach(([n,ic])=>t.push({id:'t'+n,cat:'time',role:'tm',val:n,label:n,say:n,art:A.itemSvg(ic,120),adv:1}));
  D.forEach(d=>d.items.forEach(it=>t.push({id:'i'+it.name,cat:'item',label:it.name,say:it.name,art:A.itemSvg(it.name,120),lesson:d.key})));
  ['上面','下面','左邊','右邊','旁邊'].forEach(p=>t.push({id:'w'+p,cat:'pos',label:p,say:p,art:posIcon(p)}));
  t.push({id:'qwhere',cat:'q',label:'哪裡',say:'哪裡？',art:ICO.where},{id:'qwhat',cat:'q',label:'什麼',say:'什麼？',art:ICO.what},{id:'qhave',cat:'q',label:'有沒有',say:'有沒有？',art:ICO.have},{id:'qwho',cat:'q',label:'誰',say:'誰？',art:ICO.who});
  t.push({id:'qwhy',cat:'q',label:'為什麼',say:'為什麼？',art:ICO.what,adv:1},{id:'qplz',cat:'q',label:'請問',say:'請問',art:glyph('問'),adv:1});
  t.push({id:'ayes',cat:'ans',label:'對',say:'對',art:ICO.yes},{id:'ano',cat:'ans',label:'不對',say:'不對',art:ICO.wrong},{id:'aidk',cat:'ans',label:'不知道',say:'我不知道',art:ICO.idk},{id:'athx',cat:'ans',label:'謝謝',say:'謝謝',art:ICO.thanks});
  return t;
}
function core(lv){
  const c=[['我',ICO.me,'person'],['喜歡',ICO.like,'verb'],['要',ICO.want,'verb'],['不要',ICO.no,'verb'],['好',ICO.ok,'ans'],['在',ICO.at,'pos'],['有',ICO.yes,'ans'],['沒有',ICO.none,'ans'],['再一次',ICO.again,'verb'],['幫忙',ICO.help,'ans'],['完成',ICO.done,'ans']];
  if(lv===2)c.push(['因為',glyph('因'),'q'],['和',glyph('和'),'pos'],['想',glyph('想'),'verb'],['正在',glyph('正'),'verb'],['現在',glyph('現'),'pos'],['的',glyph('的'),'pos'],['一個',glyph('一'),'pos']);
  return c.map(([l,art,cat])=>({id:'c'+l,cat,label:l,say:l==='有'?'有':l==='要'?'要':l,art,core:1}));
}
const colorOf=(cat)=>CAT[cat].c;

/* ---------- 狀態 ---------- */
const ST={lv:1,size:'m',speakEach:true,rate:.8,scan:false,scanMs:1800,lesson:null,tab:'item',strip:[],fr:{tm:null,who:null,place:null,act:null}};
try{const x=JSON.parse(localStorage.getItem('aac-set')||'{}');['lv','size','speakEach','scan'].forEach(k=>{if(x[k]!==undefined)ST[k]=x[k]})}catch(e){}
const save=()=>{try{localStorage.setItem('aac-set',JSON.stringify({lv:ST.lv,size:ST.size,speakEach:ST.speakEach,scan:ST.scan}))}catch(e){}};
let voice=null;const pickVoice=()=>{const v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];voice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null};
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text){if(!text||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';if(voice)u.voice=voice;u.rate=ST.rate;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
let actx=null;function blip(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=660;g.gain.setValueAtTime(.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.12);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.14)}catch(e){}}

function mkOrd(){
  const keys=D.map(d=>d.key),sh=(a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  for(let n=0;n<2000;n++){const w=sh([...keys,'me']),p1=sh(keys),p2=sh(keys);let ok=true;for(let i=0;i<5;i++){if(w[i]===p1[i]||w[i]===p2[i]||p1[i]===p2[i])ok=false}if(ok)return{who:w,place:p1,act:p2,tm:sh(['早上','下午','晚上','放學後','星期六'])}}
  return{who:[...keys,'me'],place:keys.slice(1).concat(keys[0]),act:keys.slice(2).concat(keys.slice(0,2)),tm:['早上','下午','晚上','放學後','星期六']}
}
/* ---------- 畫面 ---------- */
const app=document.getElementById('app');
function render(){
  document.body.classList.remove('size-l','size-m','size-s');document.body.classList.add('size-'+ST.size);
  const T1=tiles().filter(x=>ST.lv===2||!x.adv);
  const lessonObj=ST.lesson?D.find(d=>d.key===ST.lesson):null;
  const vis=(x)=>!lessonObj||!x.lesson||x.lesson===ST.lesson;
  app.innerHTML='';
  // 標題與設定
  const bar=$(`<div class="bar"><h1>誰？在哪裡？做什麼？</h1>
    <div class="seg" role="group" aria-label="句子難度"><button data-lv="1" aria-pressed="${ST.lv===1}">簡單</button><button data-lv="2" aria-pressed="${ST.lv===2}">進階</button></div>
    <div class="seg" role="group" aria-label="格子大小"><button data-sz="l" aria-pressed="${ST.size==='l'}">大</button><button data-sz="m" aria-pressed="${ST.size==='m'}">中</button><button data-sz="s" aria-pressed="${ST.size==='s'}">小</button></div>
    <button class="tg" id="tgEach" aria-pressed="${ST.speakEach}">點了就念</button>
    <button class="tg" id="tgSlow" aria-pressed="${ST.rate<.7}">慢慢說</button>
    <button class="tg" id="tgShuf">換順序</button>
    <button class="tg" id="tgSet">設定學生</button>
    <button class="tg" id="tgScan" aria-pressed="${ST.scan}">掃描</button></div>`);
  bar.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ST.lv=+b.dataset.lv;save();render()});
  bar.querySelectorAll('[data-sz]').forEach(b=>b.onclick=()=>{ST.size=b.dataset.sz;save();render()});
  bar.querySelector('#tgEach').onclick=()=>{ST.speakEach=!ST.speakEach;save();render()};
  bar.querySelector('#tgSlow').onclick=()=>{ST.rate=ST.rate<.7?.8:.55;render()};
  bar.querySelector('#tgSet').onclick=()=>openSet();
  bar.querySelector('#tgShuf').onclick=()=>{ST.ord=mkOrd();render()};
  bar.querySelector('#tgScan').onclick=()=>{ST.scan=!ST.scan;save();render()};
  app.appendChild(bar);
  // 整句框架
  if(!ST.ord)ST.ord=mkOrd();const FR=ST.fr,ROLES=ST.lv===2?[['tm','什麼時候？','var(--r-when,#9A66DA)'],['who','誰？','var(--r-who)'],['place','在哪裡？','var(--r-where)'],['act','做什麼？','var(--r-what)']]:[['who','誰？','var(--r-who)'],['place','在哪裡？','var(--r-where)'],['act','做什麼？','var(--r-what)']];
  const TM_ART=(t)=>A.itemSvg(TIMES.find(x=>x[0]===t)[1],60);
  const frame=$(`<div class="frame" aria-label="整句：誰在哪裡做什麼"><div class="prev" id="prev"></div><div class="fslots" id="fsl"></div><div class="fact"><button class="play" id="fplay">說整句</button><div class="mini"><button id="fdice" aria-label="亂數">亂數</button><button id="fclr" aria-label="清除">清除</button></div></div></div>`);
  const frSentence=()=>{const p=[];if(ST.lv===2&&FR.tm)p.push(FR.tm+'，');if(FR.who)p.push(nmOf(FR.who));if(FR.place)p.push('在'+bySc(FR.place).place);if(FR.act)p.push(bySc(FR.act).act);return p.join('')};
  const bySc=(k)=>D.find(d=>d.key===k);
  let syncP=null;const drawFrame=()=>{if(syncP)syncP();
    const sl=frame.querySelector('#fsl');sl.innerHTML='';
    ROLES.forEach(([k,lab,col])=>{
      const v=FR[k];let art='',txt='';
      if(v){if(k==='who'){art=picOf(v,100);txt=nmOf(v)}else if(k==='place'){art=A.itemSvg(PICON[v],80);txt='在'+bySc(v).place}else if(k==='act'){art=A.itemSvg(AICON[v],80);txt=bySc(v).act}else{art=TM_ART(v);txt=v}}
      const b=$(`<button class="fslot ${v?'on':''}" style="--sc:${col}">${v?art+txt:lab}</button>`);
      b.onclick=()=>{if(v){blip();speak(txt)}else{const p=document.querySelector('.pick3');if(p)p.scrollIntoView({behavior:'smooth',block:'center'})}};sl.appendChild(b)});
    const pv=frame.querySelector('#prev');
    if(FR.who&&FR.place&&FR.act)pv.innerHTML=A.scene(FR.place,{who:FR.who==='me'?FR.act:FR.who,act:FR.act,items:false,time:ST.lv===2?FR.tm:undefined});else pv.textContent='選好「誰、在哪裡、做什麼」，圖片就會出現';
  };
  drawFrame();
  frame.querySelector('#fplay').onclick=()=>{blip();speak(frSentence()+(frSentence()?'。':''))};
  frame.querySelector('#fclr').onclick=()=>{FR.tm=FR.who=FR.place=FR.act=null;drawFrame()};
  frame.querySelector('#fdice').onclick=()=>{const r=()=>D[Math.floor(Math.random()*5)].key;FR.who=Math.random()<.2?'me':r();FR.place=r();FR.act=r();FR.tm=TIMES[Math.floor(Math.random()*5)][0];blip();drawFrame();speak(frSentence()+'。')};
  app.appendChild(frame);
  // 三種挑選：誰？在哪裡？做什麼？
  const RCOL={tm:'#9A66DA',who:'#3F7FD9',place:'#2E9B63',act:'#E0701F'},RLAB={tm:'什麼時候？',who:'誰？',place:'在哪裡？',act:'做什麼？'};
  const pk=$(`<div class="pick3" aria-label="挑選：誰、在哪裡、做什麼"></div>`);
  ROLES.forEach(([k])=>{
    const row=$(`<div class="prow" style="--rc:${RCOL[k]}"><div class="rl">${RLAB[k]}</div><div class="pt"></div></div>`);
    T1.filter(x=>x.role===k).sort((a,b)=>ST.ord[k].indexOf(a.val)-ST.ord[k].indexOf(b.val)).forEach(x=>{
      const b=$(`<button class="tile" style="--c:${RCOL[k]}" data-v="${x.val}" aria-pressed="${FR[k]===x.val}"><span class="pic">${x.art||''}</span><span>${x.label}</span></button>`);
      b.onclick=()=>{blip();if(ST.speakEach)speak(x.say);FR[k]=FR[k]===x.val?null:x.val;row.querySelectorAll('.tile').forEach(e=>e.setAttribute('aria-pressed',FR[k]===e.dataset.v));drawFrame()};
      row.querySelector('.pt').appendChild(b)});
    pk.appendChild(row)});
  app.appendChild(pk);
  const syncPick=()=>pk.querySelectorAll('.prow').forEach((row,i)=>{const k=ROLES[i][0];row.querySelectorAll('.tile').forEach(e=>e.setAttribute('aria-pressed',FR[k]===e.dataset.v))});
  syncP=syncPick;
  // 掃描
  startScan();
}
/* ---------- 單鍵掃描 ---------- */
let scanTimer=null,scanIdx=-1,scanEls=[];
function startScan(){
  clearInterval(scanTimer);document.querySelectorAll('.pick').forEach(e=>e.remove());
  if(!ST.scan)return;
  scanEls=[...document.querySelectorAll('.tabs button,.pick3 .tile,.grid .tile,.core .tile,.say button,#play,#back,#clr')];scanIdx=-1;
  const pk=$(`<button class="pick">選這個（或按空白鍵）</button>`);pk.onclick=pickNow;document.body.appendChild(pk);
  const step=()=>{scanEls.forEach(e=>e.classList.remove('scan'));scanIdx=(scanIdx+1)%scanEls.length;const e=scanEls[scanIdx];e.classList.add('scan');e.scrollIntoView({block:'nearest',inline:'nearest'})};
  step();scanTimer=setInterval(step,ST.scanMs);
}
function pickNow(){const e=scanEls[scanIdx];if(e){clearInterval(scanTimer);e.click();if(ST.scan)setTimeout(()=>{if(document.body.contains(e))return;},0)}}
document.addEventListener('keydown',(ev)=>{if(!ST.scan)return;if(ev.code==='Space'||ev.key==='Enter'){ev.preventDefault();const e=scanEls[scanIdx];if(e&&!e.classList.contains('pick')){clearInterval(scanTimer);const wasTab=e.closest('.tabs');e.click();if(!wasTab&&document.body.contains(app)&&ST.scan&&app.contains(e)){scanTimer=setInterval(()=>{scanEls.forEach(x=>x.classList.remove('scan'));scanIdx=(scanIdx+1)%scanEls.length;const n=scanEls[scanIdx];n.classList.add('scan')},ST.scanMs)}}}});

function openSet(){
  const dlg=document.createElement('div');dlg.className='dlg';
  const box=document.createElement('div');dlg.appendChild(box);
  const draw=()=>{
    box.innerHTML=`<h2>設定學生（誰？）</h2><p>照片只存在這台裝置的瀏覽器裡，不會上傳到網路。沒換照片的人，就顯示卡通人物。</p>`;
    D.forEach(d=>{
      const r=document.createElement('div');r.className='prs';
      r.innerHTML=`<div class="ph">${picOf(d.key,84)}</div><input type="text" value="${nmOf(d.key).replace(/"/g,'&quot;')}" aria-label="名字" maxlength="8"><button type="button" class="pk">選照片</button><button type="button" class="rs">還原</button><input type="file" accept="image/*" hidden>`;
      const inp=r.querySelector('input[type=text]'),fi=r.querySelector('input[type=file]');
      inp.onchange=()=>{const v=inp.value.trim();PP[d.key]=Object.assign(PP[d.key]||{},{name:v&&v!==d.who?v:undefined});savePP();};
      r.querySelector('.pk').onclick=()=>fi.click();
      fi.onchange=async()=>{if(!fi.files[0])return;try{const p=await photoFrom(fi.files[0]);PP[d.key]=Object.assign(PP[d.key]||{},{photo:p});if(!savePP())alert('儲存失敗：這台裝置的儲存空間可能不足。');draw()}catch(e){alert('這張圖片無法讀取，請換一張。')}};
      r.querySelector('.rs').onclick=()=>{delete PP[d.key];savePP();draw()};
      box.appendChild(r)});
    const note=document.createElement('p');note.textContent='想讓另一台裝置（例如家長的手機）也用同一組照片：先按「匯出設定檔」存成檔案，傳給家長，再在對方的裝置按「匯入設定檔」。設定檔內含照片，請只傳給家長本人。';box.appendChild(note);
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<button type="button" id="ex">匯出設定檔</button><button type="button" id="im">匯入設定檔</button><input type="file" id="imf" accept=".json,application/json" hidden><button type="button" class="go" id="ok">完成</button>`;
    box.appendChild(row);
    row.querySelector('#ex').onclick=()=>{const b=new Blob([JSON.stringify({v:1,people:PP})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='溝通板學生設定.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
    row.querySelector('#im').onclick=()=>row.querySelector('#imf').click();
    row.querySelector('#imf').onchange=async(e)=>{const fl=e.target.files[0];if(!fl)return;try{const j=JSON.parse(await fl.text());if(!j||typeof j.people!=='object')throw 0;const ok={};D.forEach(d=>{const q=j.people[d.key];if(q&&typeof q==='object'){ok[d.key]={};if(typeof q.name==='string')ok[d.key].name=q.name.slice(0,8);if(typeof q.photo==='string'&&/^data:image\/jpeg;base64,/.test(q.photo))ok[d.key].photo=q.photo}});PP=ok;savePP();draw()}catch(err){alert('這個檔案不是正確的設定檔。')}};
    row.querySelector('#ok').onclick=()=>{dlg.remove();render()};
  };
  draw();document.body.appendChild(dlg);
}
/* ---------- 列印圖卡（網址加 #print）---------- */
function buildPrint(){
  document.body.classList.add('print');
  const all=tiles().concat(core(2));const pr=document.getElementById('print');let h='';
  const groups=[['person','人物・誰'],['place','地點・在哪裡'],['verb','事情・做什麼'],['time','時間'],['item','物品'],['pos','方位'],['q','問句'],['ans','回答'],['core','常用字']];
  groups.forEach(([k,n])=>{
    const L=k==='core'?core(2):tiles().filter(x=>x.cat===k);
    for(let i=0;i<L.length;i+=18){
      h+=`<div class="pg"><h2>休閒活動溝通圖卡｜${n}</h2><div class="pgrid">${L.slice(i,i+18).map(x=>`<div class="pc" style="--c:${k==='core'?'#8C7468':colorOf(x.cat)}"><div class="pic">${x.art||''}</div><div>${x.label}</div></div>`).join('')}</div></div>`;
    }
  });
  pr.innerHTML=h.replace(/var\(--c-([a-z]+)\)/g,(m,a)=>getComputedStyle(document.documentElement).getPropertyValue('--c-'+a));
}
if(location.hash==='#print')buildPrint();else render();
})();
</script>
